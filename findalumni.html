{% block content %}
<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-5 text-center" style="max-width: 450px; width: 100%; border-radius: 15px;">

        <!-- Icon -->
        <div class="mb-4">
            <i class="feather-lock" style="font-size: 50px; color: #6c63ff;"></i>
        </div>

        <!-- Title -->
        <h3 class="mb-3 fw-bold">Access Restricted</h3>

        <!-- Message -->
        <p class="text-muted mb-4">
            Please login or create an account to access the alumni directory.
        </p>

        <!-- Buttons -->
        <div class="d-grid gap-3">

            <a href="{% url 'Management_app:login' %}" class="btn btn-primary btn-lg">
                Login
            </a>

            <a href="{% url 'Management_app:register' %}" class="btn btn-outline-primary btn-lg">
                Register
            </a>

        </div>

    </div>

</div>

{% endblock %}
