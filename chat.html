{% extends 'Alumni/alumni_dashboard.html' %}
{% block content %}

<div class="container mt-4">

    <h4>Chat with {{ receiver.username }}</h4>

    <!--<div class="card p-3 mb-3" style="height: 400px; overflow-y: scroll;"> !-->
    <div class="card p-3 mb-3"
     style="min-height: 120px; max-height: 400px; overflow-y: auto;">
     
        {% for msg in messages %}
            {% if msg.sender == request.user %}
                <div class="text-end mb-2">
                    <span class="badge bg-primary">{{ msg.message }}</span>
                </div>
            {% else %}
                <div class="text-start mb-2">
                    <span class="badge bg-secondary">{{ msg.message }}</span>
                </div>
            {% endif %}
        {% endfor %}

    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="input-group">
            <input type="text" name="message" class="form-control" placeholder="Type message...">
            <button class="btn btn-primary">Send</button>
        </div>
    </form>

</div>

{% endblock %}
