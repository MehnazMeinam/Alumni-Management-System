{% extends 'Alumni/alumni_dashboard.html' %}

{% block content %}

<h2>Gallery</h2>

<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px;">

{% for img in images %}

<div>
    <img src="{{ img.image.url }}" width="100%">
    <h4>{{ img.title }}</h4>
</div>

{% endfor %}

</div>

{% endblock %}
