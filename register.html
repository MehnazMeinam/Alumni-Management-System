{% load static %}
<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8">
    <title>Register</title>

    <link rel="shortcut icon" href="{% static 'assets/images/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/vendors/css/vendors.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/theme.min.css' %}">
</head>

<body>

<main class="auth-minimal-wrapper">
    <div class="auth-minimal-inner">
        <div class="minimal-card-wrapper">
            <div class="card mb-4 mt-5 mx-4 mx-sm-0 position-relative">

                <div class="wd-50 bg-white p-2 rounded-circle shadow-lg position-absolute translate-middle top-0 start-50">
                    <img src="{% static 'assets/images/logo-abbr.png' %}" class="img-fluid">
                </div>

                <div class="card-body p-sm-5">
                    <h2 class="fs-20 fw-bolder mb-4">Alumni Registration</h2>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
                        <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

                        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                        <input type="password" name="confirm_password" class="form-control mb-3" placeholder="Confirm Password" required>

                        <input type="text" name="batch" class="form-control mb-3" placeholder="Batch (e.g., 2022)" required>
                        <input type="text" name="department" class="form-control mb-3" placeholder="Department" required>

                        <input type="text" name="job_title" class="form-control mb-3" placeholder="Job Title">
                        <input type="text" name="company" class="form-control mb-3" placeholder="Company">
                        <input type="url" name="linkedin" class="form-control mb-3" placeholder="LinkedIn Profile URL">

                        <label class="mb-1">Upload Profile Photo</label>
                        <input type="file" name="photo" class="form-control mb-3">

                        <button type="submit" class="btn btn-primary w-100 mt-3">
                            Create Account
                        </button>
                    </form>

                    <div class="mt-4 text-muted">
                        Already have an account?
                        <a href="{% url 'Management_app:login' %}" class="fw-bold">Login</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<script src="{% static 'assets/vendors/js/vendors.min.js' %}"></script>
<script src="{% static 'assets/js/common-init.min.js' %}"></script>

</body>
</html>
